
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Museric | Official Artist Website</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #201e1b;
    color: #f5e7cb;
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

main {
    max-width: 1100px;
    width: 100%;
    padding: 50px 30px;
}

.hero {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 50px;
}

.portrait-wrap {
    position: relative;
    width: 340px;
    flex-shrink: 0;
}

.portrait {
    width: 100%;
    display: block;
    border-radius: 48% 48% 12px 12px;
    border: 5px solid #e8ad53;
    box-shadow: -12px 12px 0 #c76b38;
}

.content {
    position: relative;
    isolation: isolate;
}

.eyebrow {
    color: #e8ad53;
    letter-spacing: 4px;
    font-size: 12px;
    font-weight: 600;
}

h1 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(65px, 10vw, 125px);
    font-weight: normal;
    line-height: 1.3;
    margin: 10px 0;
    transform: rotate(-5deg);
    text-shadow: 4px 5px #a64e2d;
}

.subtitle {
    letter-spacing: 4px;
    font-size: 14px;
    color: #e8ad53;
    font-weight: 600;
}

.record {
    position: absolute;
    right: -15px;
    top: -25px;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: repeating-radial-gradient(
        circle,
        #151515 0px,
        #151515 5px,
        #35312b 6px,
        #151515 7px
    );
    z-index: -1;
    animation: spin 18s linear infinite;
}

.record::after {
    content: '♪';
    position: absolute;
    inset: 35%;
    border-radius: 50%;
    background: #c76b38;
    color: #f5e7cb;
    display: grid;
    place-items: center;
    font-size: 35px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.message {
    font-size: 28px;
    font-weight: 600;
    margin-top: 40px;
    margin-bottom: 8px;
}

.tagline {
    color: #e8ad53;
    font-size: 17px;
}

.wave {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 55px;
    margin-top: 20px;
}

.wave span {
    width: 5px;
    height: 35px;
    border-radius: 4px;
    background: #c76b38;
    animation: bounce 1.2s ease-in-out infinite alternate;
}

.wave span:nth-child(2n) {
    background: #e8ad53;
    animation-delay: -0.4s;
}

.wave span:nth-child(3n) {
    animation-delay: -0.8s;
}

@keyframes bounce {
    from { transform: scaleY(0.3); }
    to { transform: scaleY(1.2); }
}

.stripe {
    width: 100%;
    height: 14px;
    margin-top: 50px;
    border-radius: 10px;
    background: linear-gradient(
        90deg,
        #c76b38 0% 33%,
        #e8ad53 33% 66%,
        #f5e7cb 66% 100%
    );
}

footer {
    padding: 20px;
    color: #bcb0a0;
    font-size: 12px;
    letter-spacing: 3px;
    text-align: center;
}

@media (max-width: 760px) {
    .hero {
        flex-direction: column;
        text-align: center;
        gap: 35px;
    }

    .portrait-wrap {
        width: min(240px, 85%);
    }

    .record {
        width: 180px;
        height: 180px;
        right: 0;
    }

    .wave {
        justify-content: center;
    }

    .message {
        font-size: 23px;
    }

    .subtitle {
        font-size: 11px;
        letter-spacing: 3px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .record, .wave span {
        animation: none;
    }
}
</style>
</head>

<body>

<main>
    <section class="hero">

        <div class="portrait-wrap">
            <img src="museric.png"
                 class="portrait"
                 alt="Museric artist portrait">
        </div>

        <div class="content">

            <div class="record" aria-hidden="true"></div>

            <div class="eyebrow">
                INDEPENDENT ARTIST
            </div>

            <h1>Museric</h1>

            <div class="subtitle">
                SINGER / SONGWRITER
            </div>

            <div class="message">
                Good things are in the works.
            </div>

            <div class="tagline">
                New music. New beginnings.
            </div>

            <div class="wave" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </section>

    <div class="stripe"></div>
</main>

<footer>
    MUSERIC.CA &bull; COMING SOON &bull; 2026
</footer>

</body>
</html>
