
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museric | Official Artist Website</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #171717;
            color: #f0ede6;
            font-family: Georgia, serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            letter-spacing: 0.2em;
            font-weight: normal;
            margin: 25px 0;
        }

        .subtitle {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .line {
            width: 60px;
            height: 1px;
            background: #77736b;
            margin: 30px auto;
        }

        .coming-soon {
            color: #b8b4ab;
            font-size: 20px;
            font-style: italic;
        }

        footer {
            position: absolute;
            bottom: 25px;
            color: #77736b;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <main>
        <div class="subtitle">Singer &amp; Songwriter</div>
        <h1>MUSERIC</h1>
        <div class="line"></div>
        <div class="coming-soon">Coming Soon</div>
    </main>

    <footer>&copy; 2026 Museric | museric.ca</footer>

</body>
</html>
